<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Castle Genesis</title>

    <!-- 🌍 Base deploy detection -->
    <script>
      const hostname = location.hostname;
      let mode = 'ghost'; // default
      if (hostname.includes('firebaseapp.com') || hostname.includes('web.app')) {
        mode = 'live';
      } else if (hostname.includes('github.io')) {
        mode = 'dev';
      }
      window.__CASTLE_ENV__ = {
        mode,
        deploy: hostname.includes("github.io") ? "github" : "local"
      };
    </script>
    <script type="module" crossorigin src="/-rh-dashboard/assets/main-BxNGkU89.js"></script>
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
