name: Firebase Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CODEX_DATE: "2025-07-12"
      FIREBASE_PROJECT_ID: castle-genesis
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Cache installed dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            functions/node_modules
            ~/.npm
          key: castle-genesis-${{ runner.os }}-node22-${{ hashFiles('package-lock.json', 'functions/package-lock.json') }}
          restore-keys: |
            castle-genesis-${{ runner.os }}-node22-

      - name: Deploy Castle Genesis
        run: npm run deploy:ci
